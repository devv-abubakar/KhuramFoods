<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khuram Foods | Quality You Can Trust</title>
    
    <!-- Google Fonts for better typography -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Reset & General Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header Styles */
        header {
            background-color: #ffffff;
            padding: 1.5rem 5%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-size: 1.8rem;
            font-weight: 600;
            color: #d32f2f; /* Brand Color */
            text-decoration: none;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
        }

        nav a {
            text-decoration: none;
            color: #555;
            font-weight: 400;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #d32f2f;
        }

        /* Hero Section Styles */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 4rem 1rem;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #222;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #666;
            max-width: 600px;
            margin-bottom: 2rem;
        }

        .cta-button {
            background-color: #d32f2f;
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }

        .cta-button:hover {
            background-color: #b71c1c;
        }

        /* Footer Styles */
        footer {
            background-color: #222;
            color: #fff;
            text-align: center;
            padding: 1.5rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Header / Navigation -->
    <header>
        <a href="#" class="brand-logo">Khuram Foods</a>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content (Hero Section) -->
    <main>
        <h1>Welcome to Khuram Foods</h1>
        <p class="subtitle">Delivering the finest quality products directly to you. Simple, fresh, and trustworthy.</p>
        <a href="#" class="cta-button">Explore Our Brand</a>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Khuram Foods. All Rights Reserved.</p>
    </footer>

</body>
</html>
